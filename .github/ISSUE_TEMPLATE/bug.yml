name: Bug report
description: Report a reproducible InsightOS problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    attributes:
      label: InsightOS version
      placeholder: v0.1.0-preview.1
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Operating system, hardware, browser, and relevant component versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots

