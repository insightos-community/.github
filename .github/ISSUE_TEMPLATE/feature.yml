name: Feature request
description: Propose an InsightOS feature or documentation improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Component
      options:
        - Distribution and installer
        - Ability Framework
        - Semantic Framework or Pilot
        - Insight Studio
        - SDK
        - Semantic Map
        - Simulator or assets
        - Package Manager
        - Documentation
        - Other
    validations:
      required: true

