# Generated by run-insightsemantic.sh. ROS_DISTRO is a literal: do not use ${ROS_DISTRO}.
name: insightsemantic

services:
  allinone:
    image: ${RELEASE_IMAGE:-git.insightos.cn:11016/framework/insightsemantic:1.0.0}
    container_name: ${RELEASE_CONTAINER_NAME:-InsightSemantic}
    ipc: shareable
    shm_size: 8gb
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5174:5174"
      - "8000:8000"
    env_file:
      - .env
    environment:
      RELEASE_HOME: /opt/jushi
      ROS_DISTRO: humble
      ROSBRIDGE_PORT: ${ROSBRIDGE_PORT:-9091}
      MUJOCO_GL: ${MUJOCO_GL:-egl}
      PLUGIN_MUJOCO_GUI_MODE: ${PLUGIN_MUJOCO_GUI_MODE:-off}
      MUJOCO_SCENE_NAME: ${MUJOCO_SCENE_NAME:-palletizing_depalletizing_001}
      MUJOCO_SCENE_ID: ${MUJOCO_SCENE_ID:-1}
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      ABILITY_V1_ENDPOINT: ${ABILITY_V1_ENDPOINT:-http://127.0.0.1:48080}
      ABILITY_V2_ENDPOINT: ${ABILITY_V2_ENDPOINT:-http://127.0.0.1:48081}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-insightos123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studio_semantic}
      MYSQL_USER: ${MYSQL_USER:-studio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-insightos123}
      MYSQL_PORT: ${MYSQL_PORT:-13306}
      GATEWAY_ADDR: http://127.0.0.1:18080
      PLUGIN_ADDR: http://127.0.0.1:8000
      SEMANTIC_ENV_FILE: /opt/jushi/.env
      SEMANTIC_IDE_COMMUNITY_SNAPSHOT: /opt/jushi/seed/community/map-snapshot.json
      SEMANTIC_IDE_MAP_BINDING_ROOT: /opt/jushi/data/semantic/map-bindings
    volumes:
      - semantic-data:/opt/jushi/data/semantic
      - studio-workspace:/opt/jushi/data/studio/workspace
      - studio-logs:/opt/jushi/data/studio/logs
      - mysql-data:/var/lib/mysql
      - redis-data:/var/lib/redis
      - mujoco-output:/opt/plugin-mujoco/output
      - mujoco-logs:/opt/plugin-mujoco/logs
      - mujoco-user-asset:/opt/sim_asset/mujoco
      - map-data:/opt/jushi/data/semantic-map
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/jushi/runtime/doctor.sh", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s

volumes:
  semantic-data:
    name: InsightSemantic-semantic-data
  studio-workspace:
    name: InsightSemantic-studio-workspace
  studio-logs:
    name: InsightSemantic-studio-logs
  mysql-data:
    name: InsightSemantic-mysql-data
  redis-data:
    name: InsightSemantic-redis-data
  mujoco-output:
    name: InsightSemantic-mujoco-output
  mujoco-logs:
    name: InsightSemantic-mujoco-logs
  mujoco-user-asset:
    name: InsightSemantic-mujoco-user-asset
  map-data:
    name: InsightSemantic-map-data
